name: Eco Sentinel Africa CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. LINT - Vérification de la qualité du code
  # ==========================================

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff - Lint
        run: uv run ruff check src tests

      - name: Ruff - Format
        run: uv run ruff format --check src tests

      - name: Mypy - Type checking
        run: uv run mypy src


  # ==========================================
  # 2. TESTS - Tests unitaires et couverture
  # ==========================================

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Pytest
        run: uv run pytest --cov -q


  # ==========================================
  # 3. BUILD - Construction de l'image Docker
  # ==========================================

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          echo "Construction de l'image Docker..."

          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/eco-sentinel-africa:latest .

      - name: Export Docker image
        run: |
          echo "Exportation de l'image Docker..."

          docker save \
            ${{ secrets.DOCKER_USERNAME }}/eco-sentinel-africa:latest \
            -o image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: eco-sentinel-docker-image
          path: image.tar
          retention-days: 1


  # ==========================================
  # 4. PUSH - Publication sur Docker Hub
  # ==========================================

  push:
    name: Push Docker Hub
    runs-on: ubuntu-latest
    needs: build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: eco-sentinel-docker-image
          path: .

      - name: Load Docker image
        run: |
          echo "Chargement de l'image Docker..."

          docker load -i image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          echo "Publication de l'image sur Docker Hub..."

          docker push \
            ${{ secrets.DOCKER_USERNAME }}/eco-sentinel-africa:latest

      - name: Publication réussie
        run: |
          echo "Image Docker publiée avec succès !"
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/eco-sentinel-africa:latest"
