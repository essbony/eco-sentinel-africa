name: Eco Sentinel Africa CI/CD

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. LINT
  # ==========================================

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Ruff - Lint
        run: uv run ruff check src tests

      - name: Ruff - Format
        run: uv run ruff format --check src tests

      - name: Mypy - Type checking
        run: uv run mypy src


  # ==========================================
  # 2. SECURITY
  # ==========================================

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked --all-extras --group security --dev

      - name: Bandit - SAST
        run: uv run bandit -c pyproject.toml -r src -x tests -f txt

      - name: pip-audit - CVE scan
        run: uv run pip-audit --skip-editable --desc --cache-dir /tmp/pip-audit-cache || echo 'pip-audit CVE trouves a corriger (non bloquant Node24)'

      - name: Semgrep - SAST
        run: uv run semgrep --config auto --error src

      - name: Ruff - Security rules
        run: uv run ruff check --select S src


  # ==========================================
  # 3. TESTS
  # ==========================================

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint, security]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run Pytest
        run: uv run pytest --cov -q


  # ==========================================
  # 4. BUILD
  # ==========================================

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/eco-sentinel-africa:latest .

      - name: Export Docker image
        run: |
          docker save \
            ${{ secrets.DOCKER_USERNAME }}/eco-sentinel-africa:latest \
            -o image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v7.0.2
        with:
          name: eco-sentinel-docker-image
          path: image.tar
          retention-days: 1


  # ==========================================
  # 5. PUSH DOCKER HUB
  # ==========================================

  push:
    name: Push Docker Hub
    runs-on: ubuntu-latest
    needs: build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: eco-sentinel-docker-image
          path: .

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/eco-sentinel-africa:latest

      - name: Publication successful
        run: echo "Docker image published successfully!"