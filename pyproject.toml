[project]
name = "eco_sentinel"
version = "0.1.0"
description = "Eco Sentinel Africa — système autonome de surveillance environnementale (vision + multi-agents A2A)"
readme = "README.md"
authors = [
    { name = "bony", email = "essbony@outlook.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]==0.3.26",
    "deepeval>=4.3.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mypy>=2.4.0",
    "openai>=3.39.0",
    "pillow>=10.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "ruff>=0.17.2",
    "uvicorn[standard]>=0.32",
    "websockets>=12.0",
]

[project.scripts]
meta-ai-dev = "meta_ai_dev:main"
eco-sentinel = "eco_sentinel.main:main"
eco-sentinel-africa = "eco_sentinel.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
eval = [
    "deepeval>=2.2",
    "pytest-asyncio>=0.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
eval = [
    "deepeval>=2.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "unit: tests unitaires",
    "integration: tests d'intégration",
    "contract: tests de contrat",
    "e2e: tests bout-en-bout",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.uv]
managed = true
